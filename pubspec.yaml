name: songies
description: "A personal music player for Android, Windows and Linux."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.4.1+11

environment:
  sdk: ^3.13.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  drift: ^2.35.2
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0
  crypto: ^3.0.7
  image: ^4.12.0
  material_color_utilities: ^0.13.0
  just_audio: ^0.10.6
  media_kit: ^1.2.6
  just_audio_media_kit:
    # Patched copy: exposes its mpv players for the equalizer (PATCHED.md).
    path: packages/just_audio_media_kit
  media_kit_libs_windows_audio: ^1.0.9
  media_kit_libs_linux: ^1.2.1
  audio_session: ^0.2.4
  audio_service: ^0.18.19
  audio_service_mpris: ^0.2.1
  smtc_windows: ^1.1.0
  audio_metadata_reader: ^1.8.1
  file_picker: ^13.1.0
  http: ^1.6.0
  permission_handler: ^13.0.2
  flutter_svg: ^2.3.0
  window_manager: ^0.5.2
  sqlite3: ^3.7.1
  connectivity_plus: ^7.3.1
  collection: ^1.19.1
  animations: ^3.0.0
  flutter_secure_storage: ^11.2.0
  # YouTube sign-in web view (Android WebView, Windows WebView2). The
  # platform packages are used directly, without the flutter_inappwebview
  # facade: the stable 6.1.5's Android plugin uses
  # getDefaultProguardFile('proguard-android.txt'), which AGP 9 rejects, and
  # the 6.2.0 facade that fixes it also pulls in a Linux (WPE WebKit) plugin
  # the Linux build has no libraries for. Exact versions: the 6.2.0 line is
  # still published as betas.
  # TODO: replace with stable flutter_inappwebview 6.2.x once published.
  flutter_inappwebview_platform_interface: 1.4.0-beta.3
  flutter_inappwebview_android: 1.2.0-beta.3
  flutter_inappwebview_windows: 0.7.0-beta.3
  # Linux sign-in. pointycastle: Chromium cookie decryption (AES-CBC,
  # PBKDF2). dbus: the Chromium keyring password from the Secret Service or
  # KWallet, in Dart (no native build step). desktop_webview_window:
  # Google's sign-in page in a WebKitGTK window (it also registers a
  # WebView2 plugin on Windows, unused there). Exact version: 0.4.0 is the
  # one probed on Linux (docs/innertube-notes.md).
  pointycastle: ^4.0.0
  dbus: ^0.7.15
  desktop_webview_window: 0.4.0
  url_launcher: ^6.3.1
  archive: ^4.6.0
  sentry_flutter: ^10.3.0
  # Accounts (lib/account). Session in the keyring via our own LocalStorage.
  supabase_flutter: ^2.18.3
  app_links: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The website's showcase clips (integration_test/showcase, tool/showcase.sh).
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2
  fake_async: ^1.3.3
  # Uploads debug symbols to Sentry from the release workflow
  # (docs/releasing.md, "Sentry crash reports").
  sentry_dart_plugin: ^3.4.0

# smtc_windows 1.1.0 is generated with flutter_rust_bridge 2.11.1 and refuses to
# initialise against a newer runtime ("codegen version should be the same").
dependency_overrides:
  flutter_rust_bridge: 2.11.1

# sentry_dart_plugin (`dart run sentry_dart_plugin`, release workflow only).
# The project, release and auth token come from the environment variables
# SENTRY_PROJECT, SENTRY_RELEASE and SENTRY_AUTH_TOKEN. The organization token
# carries the Sentry region (EU), so no url is set here.
sentry:
  org: denis-martonak
  upload_debug_symbols: true
  upload_source_maps: false
  upload_sources: false
  # Where `--split-debug-info` puts the Dart symbols (build/symbols/<platform>).
  symbols_path: build/symbols
  # No repository integration in Sentry: do not try to attach commits.
  commits: false

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    # Static instances cut from the official variable fonts with fontTools
    # (Flutter does not apply the wght axis of a variable font by weight).
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fonts/Outfit-ExtraBold.ttf
          weight: 800
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMono-ExtraBold.ttf
          weight: 800
