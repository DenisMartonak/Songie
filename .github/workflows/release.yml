# Builds Songies for Android, Windows and Linux, and publishes a GitHub
# Release when a version tag is pushed (Plan 11, docs/releasing.md).
#
#   git tag vX.Y.Z && git push origin vX.Y.Z   build, check, publish
#   Actions > Release > Run workflow            build only, no release
#
# The tag must equal the X.Y.Z of `version: X.Y.Z+N` in pubspec.yaml, and N
# must be greater than the build in the latest release's version.json
# (tool/check_release_version.dart). Release assets:
#   songies-X.Y.Z.apk, songies-X.Y.Z-windows-setup.exe,
#   songies-X.Y.Z-x86_64.AppImage, SHA256SUMS, version.json
#
# Secrets (repository secrets, docs/releasing.md step 3) are read only via
# env: and never printed: SONGIES_KEYSTORE_BASE64, SONGIES_KEYSTORE_PASSWORD,
# SONGIES_KEY_ALIAS, SONGIES_KEY_PASSWORD.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.8
  # A tag push publishes; a manual run only builds.
  IS_RELEASE: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}

jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Fetch the previous release's version.json
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/previous"
          # The latest release (drafts and pre-releases are not "latest").
          if ! latest="$(gh release view --repo "$GITHUB_REPOSITORY" \
              --json tagName --jq .tagName 2> "$RUNNER_TEMP/gh-error")"; then
            if grep -qi 'release not found' "$RUNNER_TEMP/gh-error"; then
              echo "No previous release: the build number has nothing to compare against."
              exit 0
            fi
            cat "$RUNNER_TEMP/gh-error" >&2
            exit 1
          fi
          echo "Latest release: $latest"
          if ! gh release download "$latest" --repo "$GITHUB_REPOSITORY" \
              --pattern version.json --dir "$RUNNER_TEMP/previous"; then
            echo "::error::Release $latest has no version.json asset, so the build number cannot be checked."
            exit 1
          fi
          cat "$RUNNER_TEMP/previous/version.json"

      - name: Check the version
        id: version
        run: |
          args=(--write "$RUNNER_TEMP/release/version.json")
          if [[ "$IS_RELEASE" == true ]]; then
            args+=(--tag "$GITHUB_REF_NAME")
          fi
          if [[ -f "$RUNNER_TEMP/previous/version.json" ]]; then
            args+=(--previous "$RUNNER_TEMP/previous/version.json")
          fi
          dart tool/check_release_version.dart "${args[@]}" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/release/version.json"

      - uses: actions/upload-artifact@v4
        with:
          name: version-json
          path: ${{ runner.temp }}/release/version.json
          if-no-files-found: error

  android:
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.checks.outputs.version }}
    steps:
      - name: Require the signing secrets for a release
        if: env.IS_RELEASE == 'true'
        env:
          SONGIES_KEYSTORE_BASE64: ${{ secrets.SONGIES_KEYSTORE_BASE64 }}
          SONGIES_KEYSTORE_PASSWORD: ${{ secrets.SONGIES_KEYSTORE_PASSWORD }}
          SONGIES_KEY_ALIAS: ${{ secrets.SONGIES_KEY_ALIAS }}
          SONGIES_KEY_PASSWORD: ${{ secrets.SONGIES_KEY_PASSWORD }}
        run: |
          missing=()
          for name in SONGIES_KEYSTORE_BASE64 SONGIES_KEYSTORE_PASSWORD \
              SONGIES_KEY_ALIAS SONGIES_KEY_PASSWORD; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing signing secrets: ${missing[*]}. A release APK is never signed with the debug key. Add them as described in docs/releasing.md, step 3."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Decode the keystore
        env:
          SONGIES_KEYSTORE_BASE64: ${{ secrets.SONGIES_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$SONGIES_KEYSTORE_BASE64" ]]; then
            echo "::warning::No signing secrets: this manual build is signed with the DEBUG key. It cannot update a release install; do not hand it out."
            exit 0
          fi
          (umask 077 && printf '%s' "$SONGIES_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/songies-release.jks")
          echo "SONGIES_KEYSTORE_PATH=$RUNNER_TEMP/songies-release.jks" >> "$GITHUB_ENV"

      - name: Build the APK
        env:
          SONGIES_KEYSTORE_PASSWORD: ${{ secrets.SONGIES_KEYSTORE_PASSWORD }}
          SONGIES_KEY_ALIAS: ${{ secrets.SONGIES_KEY_ALIAS }}
          SONGIES_KEY_PASSWORD: ${{ secrets.SONGIES_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Check the APK signer
        run: |
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          apk=build/app/outputs/flutter-apk/app-release.apk
          echo "apksigner from $build_tools"
          certs="$("$build_tools/apksigner" verify --print-certs "$apk" 2>&1)"
          # The public certificate only: its DN and fingerprint. The signer's
          # label differs between build-tools versions ("Signer #1", "Signer
          # (minSdkVersion=...)").
          grep -E '^Signer.*certificate (DN|SHA-256 digest):' <<< "$certs" || {
            echo "::error::apksigner printed no signer certificate for $apk"
            # Public certificate details and warnings only; no secrets.
            echo "$certs"
            exit 1
          }
          if grep -q 'CN=Android Debug' <<< "$certs"; then
            if [[ "$IS_RELEASE" == true ]]; then
              echo "::error::The APK is signed with the Android debug key. Check the SONGIES_* signing secrets."
              exit 1
            fi
            echo "::warning::This APK is signed with the Android debug key (manual build without signing secrets)."
          fi

      - name: Name the APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/songies-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/songies-${{ env.VERSION }}.apk
          if-no-files-found: error

      - name: Delete the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/songies-release.jks"

  linux:
    needs: checks
    # The AppImage's glibc floor: build on the oldest supported runner.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.checks.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          # Flutter Linux toolchain and GTK; libmpv (media_kit, bundled into
          # the AppImage); libsecret (flutter_secure_storage); WebKitGTK 4.1
          # and libsoup 3 (desktop_webview_window).
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libmpv-dev libsecret-1-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev file

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter build linux --release

      - name: Build the AppImage
        run: tool/build_appimage.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/songies-${{ env.VERSION }}-x86_64.AppImage
          if-no-files-found: error

  windows:
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.checks.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter build windows --release

      - name: Install Inno Setup
        run: |
          # songies.iss uses ArchitecturesAllowed=x64compatible (6.3 or newer).
          choco upgrade innosetup --version=6.7.1 --allow-downgrade -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco failed ($LASTEXITCODE)" }
          $iscc = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found after installing Inno Setup' }
          # ISCC.exe carries no file version, so ask Chocolatey ("innosetup|6.7.1").
          $listed = @(choco list innosetup --exact --limit-output) -match '^innosetup\|'
          if ($LASTEXITCODE -ne 0 -or $listed.Count -eq 0) { throw 'choco list found no innosetup package' }
          $version = [version]($listed[0] -split '\|')[1]
          Write-Output "Inno Setup $version at $iscc"
          if ($version -lt [version]'6.3.0') { throw "Inno Setup $version is too old; songies.iss needs 6.3 or newer" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build the installer
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'build\windows\x64\runner\Release'
          $output = Join-Path $env:GITHUB_WORKSPACE 'build\installer'
          & $env:ISCC "/DAppVersion=$env:VERSION" "/DSourceDir=$source" "/DOutputDir=$output" windows\installer\songies.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed ($LASTEXITCODE)" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/installer/songies-${{ env.VERSION }}-windows-setup.exe
          if-no-files-found: error

  publish:
    needs: [checks, android, linux, windows]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.checks.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          files=(
            "songies-$VERSION.apk"
            "songies-$VERSION-windows-setup.exe"
            "songies-$VERSION-x86_64.AppImage"
          )
          for f in "${files[@]}" version.json; do
            [[ -f "$f" ]] || { echo "::error::Missing release file $f"; exit 1; }
          done
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS version.json

      - name: Create the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Songies $VERSION" \
            --generate-notes \
            "songies-$VERSION.apk" \
            "songies-$VERSION-windows-setup.exe" \
            "songies-$VERSION-x86_64.AppImage" \
            SHA256SUMS \
            version.json
